# /etc/coturn/coturn.conf - Edge CCTV Coturn TURN/STUN Relay Configuration

# Network & Listening Ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Relay Port Range for UDP Media (Mapped in Docker Compose)
min-port=49152
max-port=49252

# Authentication: Dynamic Ephemeral Shared Secret (RFC 5766 / REST API Auth)
use-auth-secret
static-auth-secret=cctv_turn_super_secret_dynamic_key_change_me_in_prod
realm=cctv.local

# Long-term credential mechanism & fingerprinting
lt-cred-mech
fingerprint
stale-nonce=600

# Security & Anti-Abuse
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
total-quota=100
bps-capacity=0
user-quota=12

# Local loopback and RFC 1918 security isolation (Prevent SSRF via TURN relay)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=0.0.0.0-0.255.255.255

# Logging
verbose
log-file=stdout
